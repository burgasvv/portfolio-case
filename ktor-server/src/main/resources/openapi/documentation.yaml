components:
  schemas:
    AuthRequest:
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
      required:
        - "email"
        - "password"
    ImageDependency:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        contentType:
          type: "string"
        preview:
          type: "boolean"
      required:
        - "id"
        - "name"
        - "contentType"
        - "preview"
    ProfessionDependency:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: "string"
      required:
        - "id"
        - "name"
        - "description"
    PortfolioDependencyInIdentity:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        profession:
          nullable: true
          $ref: "#/components/schemas/ProfessionDependency"
        description:
          type: "string"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "createdAt"
    IdentityResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        authority:
          type: "string"
          enum:
            - "ADMIN"
            - "USER"
        email:
          type: "string"
        status:
          type: "boolean"
        phone:
          type: "string"
        telegram:
          type: "string"
          nullable: true
        whatsapp:
          type: "string"
          nullable: true
        max:
          type: "string"
          nullable: true
        firstname:
          type: "string"
        lastname:
          type: "string"
        patronymic:
          type: "string"
        about:
          type: "string"
          nullable: true
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
        portfolio:
          nullable: true
          $ref: "#/components/schemas/PortfolioDependencyInIdentity"
      required:
        - "id"
        - "authority"
        - "email"
        - "status"
        - "phone"
        - "firstname"
        - "lastname"
        - "patronymic"
    IdentityRequest:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          nullable: true
        authority:
          type: "string"
          nullable: true
          enum:
            - "ADMIN"
            - "USER"
        email:
          type: "string"
          nullable: true
        password:
          type: "string"
          nullable: true
        status:
          type: "boolean"
          nullable: true
        phone:
          type: "string"
          nullable: true
        telegram:
          type: "string"
          nullable: true
        whatsapp:
          type: "string"
          nullable: true
        max:
          type: "string"
          nullable: true
        firstname:
          type: "string"
          nullable: true
        lastname:
          type: "string"
          nullable: true
        patronymic:
          type: "string"
          nullable: true
        about:
          type: "string"
          nullable: true
    IdentityDependency:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        authority:
          type: "string"
          enum:
            - "ADMIN"
            - "USER"
        email:
          type: "string"
        status:
          type: "boolean"
        phone:
          type: "string"
        telegram:
          type: "string"
          nullable: true
        whatsapp:
          type: "string"
          nullable: true
        max:
          type: "string"
          nullable: true
        firstname:
          type: "string"
        lastname:
          type: "string"
        patronymic:
          type: "string"
        about:
          type: "string"
          nullable: true
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
      required:
        - "id"
        - "authority"
        - "email"
        - "status"
        - "phone"
        - "firstname"
        - "lastname"
        - "patronymic"
    PortfolioDependencyInProfession:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        identity:
          $ref: "#/components/schemas/IdentityDependency"
        description:
          type: "string"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "identity"
        - "createdAt"
    ProfessionResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: "string"
        portfolios:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/PortfolioDependencyInProfession"
      required:
        - "id"
        - "name"
        - "description"
    ProfessionRequest:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          nullable: true
        name:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
    ProjectDependency:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: "string"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
      required:
        - "id"
        - "name"
        - "createdAt"
    PortfolioResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        profession:
          nullable: true
          $ref: "#/components/schemas/ProfessionDependency"
        identity:
          $ref: "#/components/schemas/IdentityDependency"
        description:
          type: "string"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
        projects:
          type: "array"
          items:
            $ref: "#/components/schemas/ProjectDependency"
      required:
        - "id"
        - "identity"
        - "createdAt"
        - "projects"
    PortfolioRequest:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          nullable: true
        professionId:
          type: "string"
          format: "uuid"
          nullable: true
        identityId:
          type: "string"
          format: "uuid"
          nullable: true
        description:
          type: "string"
          nullable: true
    PortfolioDependencyInProject:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        profession:
          nullable: true
          $ref: "#/components/schemas/ProfessionDependency"
        identity:
          $ref: "#/components/schemas/IdentityDependency"
        description:
          type: "string"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "identity"
        - "createdAt"
    VideoDependency:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        contentType:
          type: "string"
      required:
        - "id"
        - "name"
        - "contentType"
    DocumentDependency:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        contentType:
          type: "string"
      required:
        - "id"
        - "name"
        - "contentType"
    ProjectResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: "string"
          nullable: true
        portfolio:
          $ref: "#/components/schemas/PortfolioDependencyInProject"
        link:
          type: "string"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
        videos:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoDependency"
        documents:
          type: "array"
          items:
            $ref: "#/components/schemas/DocumentDependency"
      required:
        - "id"
        - "name"
        - "portfolio"
        - "createdAt"
        - "videos"
        - "documents"
    ProjectRequest:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          nullable: true
        name:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
        portfolioId:
          type: "string"
          format: "uuid"
          nullable: true
        link:
          type: "string"
          nullable: true
    ProjectFileRequest:
      type: "object"
      properties:
        projectId:
          type: "string"
          format: "uuid"
        fileIds:
          type: "array"
          items:
            type: "string"
            format: "uuid"
      required:
        - "projectId"
        - "fileIds"